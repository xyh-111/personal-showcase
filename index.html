<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的项目视频展示</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #6ea8fe;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      background: rgba(15, 17, 21, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    nav {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      margin-left: 18px;
      font-size: 14px;
    }
    nav a:hover { color: var(--text); }
    .logo { font-weight: 700; color: var(--text); }
    .hero {
      max-width: 1100px;
      margin: 0 auto;
      padding: 80px 20px 40px;
      text-align: center;
    }
    .hero h1 { font-size: clamp(2rem, 5vw, 3.5rem); margin: 0 0 12px; }
    .hero p { color: var(--muted); max-width: 600px; margin: 0 auto; }
    .section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }
    .section h2 { font-size: 1.8rem; margin-bottom: 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }
    .thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }
    .card:hover .thumb img { transform: scale(1.05); }
    .play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.25);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .card:hover .play { opacity: 1; }
    .play svg {
      width: 56px;
      height: 56px;
      fill: #fff;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
    }
    .card-body { padding: 16px; }
    .card-body h3 { margin: 0 0 6px; font-size: 1.1rem; }
    .card-body p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(110, 168, 254, 0.12);
      color: var(--accent);
    }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(6px);
    }
    .modal.open { display: flex; }
    .modal-content {
      width: min(960px, 100%);
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }
    .modal-video { aspect-ratio: 16 / 9; background: #000; }
    .modal-video iframe,
    .modal-video video {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .modal-close {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .modal-close:hover { background: rgba(255, 255, 255, 0.3); }
    footer {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 0.9rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    @media (max-width: 640px) {
      nav a { margin-left: 12px; font-size: 13px; }
      .hero { padding-top: 50px; }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <span class="logo">我的作品集</span>
      <div>
        <a href="#projects">项目</a>
        <a href="#about">关于</a>
        <a href="#contact">联系</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>你好，我是 胡晓雨</h1>
      <p>这里展示我的项目视频。点击卡片即可播放。</p>
    </section>

    <section id="projects" class="section">
      <h2>项目视频</h2>
      <div class="grid" id="projectGrid"></div>
    </section>

    <section id="about" class="section">
      <h2>关于我</h2>
      <p style="color:var(--muted); max-width: 700px;">
        目前就读于西南财经大学，人工智能专业，研二。
      </p>
    </section>

    <section id="contact" class="section">
      <h2>联系</h2>
      <p style="color:var(--muted);">
        邮箱：18696373576@163.com · GitHub：https://github.com/xyh-111
      </p>
    </section>
  </main>

  <footer>© 胡晓雨 作品集</footer>

  <!-- 视频模态框 -->
  <div class="modal" id="videoModal" role="dialog" aria-modal="true" aria-label="视频播放">
    <div class="modal-content">
      <button class="modal-close" id="modalClose" aria-label="关闭">×</button>
      <div class="modal-video" id="modalVideo"></div>
    </div>
  </div>

  <script>
    // ===== 只需修改这里：你的项目数据 =====
    const projects = [
      {
        title: "智扫通Agent",
        description: "基于RAG的智能扫地机器人客服。",
        cover: "images/智扫通Agent.jpg",
        tags: ["Python", "Langchain", "RAG"],
        videoType: "mp4", // youtube | vimeo | mp4
        videoSrc: "videos/智扫通Agent.mp4"
      },
      {
        title: "实习生筛选系统",
        description: "采用langgraph编排的实习生筛选系统。",
        cover: "images/InternScreen.jpg",
        tags: ["Python", "Langgraph", "fastapi"],
        videoType: "mp4",
        videoSrc: "videos/InternScreen.mp4"
      },
    ];

    const grid = document.getElementById('projectGrid');
    const modal = document.getElementById('videoModal');
    const modalVideo = document.getElementById('modalVideo');
    const modalClose = document.getElementById('modalClose');

    // 渲染项目卡片
    projects.forEach((p) => {
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <div class="thumb">
          <img src="${p.cover}" alt="${p.title}" loading="lazy">
          <div class="play">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="card-body">
          <h3>${p.title}</h3>
          <p>${p.description}</p>
          <div class="tags">
            ${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}
          </div>
        </div>
      `;
      card.addEventListener('click', () => openVideo(p));
      grid.appendChild(card);
    });

    // 打开视频
    function openVideo(project) {
      modalVideo.innerHTML = '';

      if (project.videoType === 'mp4') {
        const video = document.createElement('video');
        video.src = project.videoSrc;
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        modalVideo.appendChild(video);
      } else {
        const iframe = document.createElement('iframe');
        const sep = project.videoSrc.includes('?') ? '&' : '?';
        iframe.src = project.videoSrc + sep + 'autoplay=1';
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        iframe.allowFullscreen = true;
        modalVideo.appendChild(iframe);
      }

      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    // 关闭视频
    function closeVideo() {
      modal.classList.remove('open');
      modalVideo.innerHTML = ''; // 停止播放
      document.body.style.overflow = '';
    }

    modalClose.addEventListener('click', closeVideo);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeVideo();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('open')) closeVideo();
    });
  </script>
</body>
</html>
